name: skripsiflow
description: "SkripsiFlow — SaaS Bimbingan Skripsi Terstruktur Berbasis Flutter & Supabase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Backend & Auth
  supabase_flutter: ^2.5.6

  # Navigation
  go_router: ^14.1.4

  # Styling & UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  uuid: ^4.4.0

  # File handling
  file_picker: ^8.0.3

  # Icons
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
